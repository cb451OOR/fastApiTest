{% extends "base.html" %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}
<h2>Editar Cliente</h2>
<form method="post">
    <label>Nombre:</label>
    <input type="text" name="nombre" value="{{ cliente.name }}" required>

    <label>Email:</label>
    <input type="email" name="email" value="{{ cliente.email }}" required>

    <button type="submit">Guardar Cambios</button>
    <a href="{{ url_for('lista_clientes') }}">Cancelar</a>
</form>
{% endblock %}
